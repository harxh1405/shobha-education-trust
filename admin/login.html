<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff & Administration Portal | Shobha Education Trust</title>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/typography.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    body {
      background-color: var(--color-bg-offwhite);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .admin-login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .admin-card {
      background: var(--color-bg-white);
      border-top: 4px solid var(--color-accent-yellow);
      border: 1px solid var(--color-border);
      width: 100%;
      max-width: 440px;
      padding: 36px;
      border-radius: var(--radius-xs);
      box-shadow: var(--shadow-card);
    }
    .admin-logo {
      display: block;
      width: 64px;
      height: 64px;
      margin: 0 auto 16px auto;
    }
    .admin-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .admin-header h1 {
      font-size: 22px;
      color: var(--color-primary-navy);
      margin-bottom: 4px;
    }
    .admin-header p {
      font-size: 13px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .admin-note {
      background: #F8FAFC;
      border-left: 3px solid var(--color-supporting-blue);
      padding: 10px 14px;
      font-size: 12.5px;
      color: var(--color-text-secondary);
      margin-bottom: 20px;
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <header class="main-header" style="height: 70px;">
    <div class="container navbar-container" style="height: 70px;">
      <a href="../index.html" class="brand-identity">
        <img src="../assets/logo.png" alt="Shobha Education Trust" class="brand-logo-img" style="width: 48px; height: 48px;">
        <span class="brand-trust-name" style="font-size: 19px;">SHOBHA EDUCATION TRUST</span>
      </a>
      <a href="../index.html" class="btn btn-outline-navy" style="padding: 8px 16px; font-size: 12px;">← Back to Main Website</a>
    </div>
  </header>

  <main class="admin-login-wrapper">
    <div class="admin-card">
      <img src="../assets/logo.png" alt="Institutional Crest" class="admin-logo">
      <div class="admin-header">
        <h1>STAFF & ADMIN PORTAL</h1>
        <p>Authorized Personnel Only</p>
      </div>

      <div class="admin-note">
        This private portal is reserved exclusively for institutional staff to manage notices, academic calendars, timetables, syllabus documents, and exam circulars.
      </div>

      <form onsubmit="event.preventDefault(); alert('Authentication demo: Admin backend will be configured with staff credentials.');">
        <div class="form-group">
          <label class="form-label" for="staffId">Staff Identification ID</label>
          <input type="text" id="staffId" class="form-control" required placeholder="e.g. SET-STAFF-01">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          SECURE SIGN IN
        </button>
      </form>
    </div>
  </main>

</body>
</html>
